name: Daily IPTV Link Collection

on:
  schedule:
    # প্রতিদিন সকাল ৬টায় (UTC) চালাবে
    - cron: '0 6 * * *'
  workflow_dispatch:      # ম্যানুয়ালি চালানোর জন্য

permissions:
  contents: write          # ফাইল কমিট করার অনুমতি

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector script
        run: python collect_channels.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels_ind_bd.json playlist_ind_bd.m3u8 last_run_summary.json
          git diff --staged --quiet || (git commit -m "Auto-update IN/BD channels $(date -u +%Y-%m-%d)" && git push)
